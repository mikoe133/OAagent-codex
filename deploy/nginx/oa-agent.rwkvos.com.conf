# Install inside nginx's http context (for example sites-enabled).
# Production: Web 3010, Agent 3011. Both upstreams must be reachable by nginx.
server {
    server_name oa-agent.rwkvos.com;

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/oa-agent.rwkvos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oa-agent.rwkvos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 10s;
    # Never replay an Agent write/message request against another upstream.
    proxy_next_upstream off;

    # Only the public conversation API is routed directly to Agent.
    # No URI suffix on proxy_pass: preserve the complete original path.
    location ~ ^/v1/(?:models$|sessions(?:/|$)) {
        client_max_body_size 128k;
        proxy_pass http://192.168.251.1:3011;
    }

    # Reserve other API paths; do not fall through to the Web application.
    location = /v1 { return 404; }
    location /v1/ { return 404; }
    location = /__internal { return 404; }
    location ^~ /__internal/ { return 404; }
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }

    # Existing pages, assets, login/SSO and Web API routes.
    location / {
        proxy_pass http://192.168.251.1:3010;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name oa-agent.rwkvos.com;
    return 301 https://oa-agent.rwkvos.com$request_uri;
}
