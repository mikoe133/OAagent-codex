name: ${COMPOSE_PROJECT_NAME:-oa-agent}

services:
  agent:
    image: ${AGENT_IMAGE:-oa-agent:local}
    build:
      context: .
      target: agent-runtime
    init: true
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      AGENT_SESSION_STORE: /app/.context/agent-sessions.json
      CODEX_SANDBOX_MODE: danger-full-access
      NEXTTOKEN_API_KEY: ${NEXTTOKEN_API_KEY}
      NEXTTOKEN_API_BASE_URL: ${NEXTTOKEN_API_BASE_URL:-https://next-token.cc}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_API_BASE_URL: ${OPENROUTER_API_BASE_URL:-https://openrouter.ai/api/v1}
      CODEX_MODEL_PROVIDER: ${CODEX_MODEL_PROVIDER:-nexttoken}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.6-terra}
      OA_API_BASE_URL: ${OA_DOCKER_API_BASE_URL:-http://host.docker.internal:8010}
      OA_API_TOKEN_HEADER: ${OA_API_TOKEN_HEADER:-Cookie}
      OA_API_TOKEN_PREFIX: ${OA_API_TOKEN_PREFIX:-sessionid=}
      OA_USER_TOKEN_HEADER: ${OA_USER_TOKEN_HEADER:-Authorization}
      OA_USER_TOKEN_PREFIX: ${OA_USER_TOKEN_PREFIX:-Bearer}
      OA_AUTH_ALIAS: ${OA_AUTH_ALIAS:-default}
      OA_KNOWLEDGE_API_BASE_URL: ${OA_KNOWLEDGE_API_BASE_URL:-https://oa-kb.rwkvos.com/api/agent/v1}
      OA_KNOWLEDGE_BASE_API_KEY: ${OA_KNOWLEDGE_BASE_API_KEY}
      OA_AGENT_AUTOMATION_TOKEN: ${OA_AGENT_AUTOMATION_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      OA_SESSION_SECRET: ${OA_SESSION_SECRET}
      OA_SESSION_VERIFY_MAX_AGE: ${OA_SESSION_VERIFY_MAX_AGE:-0}
      AUTOMATION_MIGRATE_ON_START: ${AUTOMATION_MIGRATE_ON_START:-false}
      AUTOMATION_MAINTENANCE_ENABLED: ${AUTOMATION_MAINTENANCE_ENABLED:-true}
      AUTOMATION_MAINTENANCE_INTERVAL_SECONDS: ${AUTOMATION_MAINTENANCE_INTERVAL_SECONDS:-30}
      AUTOMATION_MODEL_CATALOG_TTL_SECONDS: ${AUTOMATION_MODEL_CATALOG_TTL_SECONDS:-300}
      AUTOMATION_MODEL_CATALOG_STALE_SECONDS: ${AUTOMATION_MODEL_CATALOG_STALE_SECONDS:-86400}
      AUTOMATION_SCHEDULE_GRACE_SECONDS: ${AUTOMATION_SCHEDULE_GRACE_SECONDS:-120}
      AUTOMATION_MANUAL_TRIGGER_LIMIT: ${AUTOMATION_MANUAL_TRIGGER_LIMIT:-3}
      AUTOMATION_MANUAL_TRIGGER_WINDOW_SECONDS: ${AUTOMATION_MANUAL_TRIGGER_WINDOW_SECONDS:-300}
    extra_hosts:
      - host.docker.internal:host-gateway
    expose:
      - "3000"
    ports:
      - "${AGENT_BIND_ADDRESS:-127.0.0.1}:${AGENT_PORT:-3001}:3000"
    volumes:
      - agent_sessions:/app/.context
      - agent_codex_home:/home/node/.codex
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app

  project-progress-worker:
    image: ${AGENT_IMAGE:-oa-agent:local}
    build:
      context: .
      target: agent-runtime
    init: true
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      NEXTTOKEN_API_KEY: ${NEXTTOKEN_API_KEY}
      NEXTTOKEN_API_BASE_URL: ${NEXTTOKEN_API_BASE_URL:-https://next-token.cc}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_API_BASE_URL: ${OPENROUTER_API_BASE_URL:-https://openrouter.ai/api/v1}
      OA_API_BASE_URL: ${OA_DOCKER_API_BASE_URL:-http://host.docker.internal:8010}
      AUTOMATION_API_BASE_URL: http://agent:3000
      PROJECT_SYNC_API_BASE_URL: ${PROJECT_SYNC_API_BASE_URL:-${OA_DOCKER_API_BASE_URL:-http://host.docker.internal:8010}}
      OA_AUTH_ALIAS: ${OA_AUTH_ALIAS:-default}
      OA_AGENT_AUTOMATION_TOKEN: ${OA_AGENT_AUTOMATION_TOKEN}
      OA_PROJECT_SYNC_TOKEN: ${OA_PROJECT_SYNC_TOKEN}
      OA_PROJECT_SYNC_TOKEN_HEADER: ${OA_PROJECT_SYNC_TOKEN_HEADER:-Authorization}
      OA_PROJECT_SYNC_TOKEN_PREFIX: ${OA_PROJECT_SYNC_TOKEN_PREFIX:-Bearer}
      PROJECT_PROGRESS_GITHUB_TOKEN: ${PROJECT_PROGRESS_GITHUB_TOKEN}
      PROJECT_PROGRESS_WRITE_ENABLED: ${PROJECT_PROGRESS_WRITE_ENABLED:-true}
      PROJECT_PROGRESS_PRODUCTION_WRITES: ${PROJECT_PROGRESS_PRODUCTION_WRITES:-I_UNDERSTAND_PRODUCTION_WRITES}
      PROJECT_PROGRESS_MODEL_PROVIDER: ${PROJECT_PROGRESS_MODEL_PROVIDER:-nexttoken}
      PROJECT_PROGRESS_MODEL: ${PROJECT_PROGRESS_MODEL:-gpt-5.6-terra}
      PROJECT_PROGRESS_MODEL_REASONING_EFFORT: ${PROJECT_PROGRESS_MODEL_REASONING_EFFORT:-medium}
      PROJECT_PROGRESS_MODEL_MAX_OUTPUT_TOKENS: ${PROJECT_PROGRESS_MODEL_MAX_OUTPUT_TOKENS:-1024}
      PROJECT_PROGRESS_WORKER_INSTANCE: ${PROJECT_PROGRESS_WORKER_INSTANCE:-oaagent-project-progress-01}
      PROJECT_PROGRESS_LEASE_SECONDS: ${PROJECT_PROGRESS_LEASE_SECONDS:-300}
      PROJECT_PROGRESS_HEARTBEAT_SECONDS: ${PROJECT_PROGRESS_HEARTBEAT_SECONDS:-10}
      PROJECT_PROGRESS_GITHUB_CONCURRENCY: ${PROJECT_PROGRESS_GITHUB_CONCURRENCY:-6}
      PROJECT_PROGRESS_AGENT_CONCURRENCY: ${PROJECT_PROGRESS_AGENT_CONCURRENCY:-2}
      PROJECT_PROGRESS_OA_WRITE_CONCURRENCY: ${PROJECT_PROGRESS_OA_WRITE_CONCURRENCY:-4}
      PROJECT_PROGRESS_AGENT_MAX_DETAIL_CALLS: ${PROJECT_PROGRESS_AGENT_MAX_DETAIL_CALLS:-12}
      PROJECT_PROGRESS_AGENT_MAX_FILES_PER_COMMIT: ${PROJECT_PROGRESS_AGENT_MAX_FILES_PER_COMMIT:-20}
      PROJECT_PROGRESS_AGENT_MAX_PATCH_CHARS_PER_FILE: ${PROJECT_PROGRESS_AGENT_MAX_PATCH_CHARS_PER_FILE:-1200}
      PROJECT_PROGRESS_AGENT_MAX_TOTAL_PATCH_CHARS: ${PROJECT_PROGRESS_AGENT_MAX_TOTAL_PATCH_CHARS:-12000}
      PROJECT_PROGRESS_STATE_DB: /app/.context/project-progress.sqlite
      PROJECT_PROGRESS_WORKSPACE_ROOT: /app/.context/project-progress-workspaces
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - agent_sessions:/app/.context
    depends_on:
      agent:
        condition: service_healthy
    command:
      - node
      - agent/dist/runtime/projectProgressWorker.js
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app

  web:
    image: ${WEB_IMAGE:-oa-web:local}
    build:
      context: .
      target: web-runtime
    init: true
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      AGENT_API_BASE_URL: http://agent:3000
      OA_API_BASE_URL: ${OA_DOCKER_API_BASE_URL:-http://host.docker.internal:8010}
      AUTOMATION_API_BASE_URL: http://agent:3000
      OA_AUTH_ALIAS: ${OA_AUTH_ALIAS:-default}
      OA_AGENT_SSO_SHARED_SECRET: ${OA_AGENT_SSO_SHARED_SECRET}
      OA_AGENT_SSO_TTL_SECONDS: ${OA_AGENT_SSO_TTL_SECONDS}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      agent:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app

volumes:
  agent_sessions:
  agent_codex_home:

networks:
  app:
    driver: bridge
