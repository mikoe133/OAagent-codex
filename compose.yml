name: ${COMPOSE_PROJECT_NAME:-oa-agent}

services:
  agent:
    image: ${AGENT_IMAGE:-oa-agent:local}
    build:
      context: .
      target: agent-runtime
    init: true
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      AGENT_SESSION_STORE: /app/.context/agent-sessions.json
      CODEX_SANDBOX_MODE: danger-full-access
      OA_API_BASE_URL: ${OA_DOCKER_API_BASE_URL:-http://host.docker.internal:8010}
      OA_AUTH_ALIAS: ${OA_AUTH_ALIAS:-default}
    extra_hosts:
      - host.docker.internal:host-gateway
    expose:
      - "3000"
    ports:
      - "${AGENT_BIND_ADDRESS:-127.0.0.1}:${AGENT_PORT:-3001}:3000"
    volumes:
      - agent_sessions:/app/.context
      - agent_codex_home:/home/node/.codex
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app

  project-progress-worker:
    image: ${AGENT_IMAGE:-oa-agent:local}
    build:
      context: .
      target: agent-runtime
    init: true
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    env_file:
      - .env
    environment:
      OA_API_BASE_URL: ${OA_DOCKER_API_BASE_URL:-http://host.docker.internal:8010}
      OA_AUTH_ALIAS: ${OA_AUTH_ALIAS:-default}
      PROJECT_PROGRESS_STATE_DB: /app/.context/project-progress.sqlite
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - agent_sessions:/app/.context
    command:
      - node
      - agent/dist/runtime/projectProgressWorker.js
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app

  web:
    image: ${WEB_IMAGE:-oa-web:local}
    build:
      context: .
      target: web-runtime
    init: true
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      AGENT_API_BASE_URL: http://agent:3000
      OA_API_BASE_URL: ${OA_DOCKER_API_BASE_URL:-http://host.docker.internal:8010}
      OA_AUTH_ALIAS: ${OA_AUTH_ALIAS:-default}
      OA_AGENT_SSO_SHARED_SECRET: ${OA_AGENT_SSO_SHARED_SECRET}
      OA_AGENT_SSO_TTL_SECONDS: ${OA_AGENT_SSO_TTL_SECONDS}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      agent:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app

volumes:
  agent_sessions:
  agent_codex_home:

networks:
  app:
    driver: bridge
