name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test agent
        run: npm test --workspace=agent

      - name: Test web
        run: npm run test:chat --workspace=frontend

      - name: Test deployment rollback
        run: npm run test:deploy

      - name: Type-check
        run: npm run typecheck

      - name: Build workspaces
        run: npm run build

      - name: Validate Compose configuration
        env:
          AGENT_API_TOKEN: ci-only-token
        run: |
          cp .env.example .env
          docker compose -f compose.yml config --quiet

  images:
    name: Build ${{ matrix.service }} image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: agent
            target: agent-runtime
          - service: web
            target: web-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/oa-agent' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      GHCR_USERNAME: ${{ github.repository_owner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS GHCR_PULL_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "Missing production secret: $name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Resolve release images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "AGENT_IMAGE=ghcr.io/${repository}-agent:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${repository}-web:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Upload Compose configuration
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_command="$(printf 'mkdir -p -- %q && cat > %q' "$DEPLOY_PATH" "$DEPLOY_PATH/compose.yml")"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$target" "$remote_command" < compose.yml

      - name: Log deployment server in to GHCR
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_command="$(printf 'docker login ghcr.io --username %q --password-stdin' "$GHCR_USERNAME")"
          printf '%s' "$GHCR_PULL_TOKEN" | ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$target" "$remote_command"

      - name: Deploy and verify health
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_command="$(printf 'bash -s -- %q %q %q' "$DEPLOY_PATH" "$AGENT_IMAGE" "$WEB_IMAGE")"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$target" "$remote_command" < scripts/deploy-compose.sh

      - name: Record deployment summary
        run: |
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Agent: \`${AGENT_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: \`${WEB_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
