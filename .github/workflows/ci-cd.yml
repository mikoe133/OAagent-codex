name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: automation-ci
          MYSQL_DATABASE: oagent_automation_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pautomation-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test agent
        run: npm test --workspace=agent

      - name: Test web
        run: npm run test:chat --workspace=frontend

      - name: Test Node automation with MySQL
        run: npm run test:automation:integration
        env:
          AUTOMATION_NODE_TEST_DATABASE_URL: mysql://root:automation-ci@127.0.0.1:3306/oagent_automation_test

      - name: Test deployment rollback
        run: npm run test:deploy

      - name: Type-check
        run: npm run typecheck

      - name: Build workspaces
        run: npm run build

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose -f compose.yml config --quiet

  images:
    name: Build ${{ matrix.service }} image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: agent
            target: agent-runtime
          - service: web
            target: web-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test') }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Export deployment image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.service }}.tar
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Compress deployment image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')
        shell: bash
        run: gzip -1 "$RUNNER_TEMP/${{ matrix.service }}.tar"

      - name: Upload deployment image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')
        uses: actions/upload-artifact@v4
        with:
          name: deployment-image-${{ matrix.service }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.service }}.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy-test:
    name: Deploy test
    if: github.ref == 'refs/heads/test' && github.event_name != 'pull_request'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: oa-agent-shared-server-deploy
      cancel-in-progress: false
    environment:
      name: test
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      NEXTTOKEN_API_KEY: ${{ secrets.NEXTTOKEN_API_KEY }}
      NEXTTOKEN_API_BASE_URL: ${{ vars.NEXTTOKEN_API_BASE_URL || 'https://next-token.cc' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_BASE_URL: ${{ vars.OPENROUTER_API_BASE_URL || 'https://openrouter.ai/api/v1' }}
      OA_DOCKER_API_BASE_URL: ${{ vars.OA_DOCKER_API_BASE_URL }}
      OA_KNOWLEDGE_API_BASE_URL: ${{ vars.OA_KNOWLEDGE_API_BASE_URL || 'https://oa-kb.rwkvos.com/api/agent/v1' }}
      OA_KNOWLEDGE_BASE_API_KEY: ${{ secrets.OA_KNOWLEDGE_BASE_API_KEY }}
      AUTOMATION_API_BASE_URL: ${{ vars.AUTOMATION_API_BASE_URL }}
      PROJECT_SYNC_API_BASE_URL: ${{ vars.PROJECT_SYNC_API_BASE_URL }}
      OA_AUTH_ALIAS: ${{ vars.OA_AUTH_ALIAS || 'default' }}
      OA_AGENT_SSO_SHARED_SECRET: ${{ secrets.OA_AGENT_SSO_SHARED_SECRET }}
      OA_AGENT_SSO_TTL_SECONDS: ${{ vars.OA_AGENT_SSO_TTL_SECONDS }}
      OA_AGENT_AUTOMATION_TOKEN: ${{ secrets.OA_AGENT_AUTOMATION_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTOMATION_EXPECTED_DATABASE_NAME: oagent_test
      OA_SESSION_SECRET: ${{ secrets.OA_SESSION_SECRET }}
      OA_SESSION_VERIFY_MAX_AGE: ${{ vars.OA_SESSION_VERIFY_MAX_AGE || '0' }}
      AUTOMATION_MIGRATE_ON_START: ${{ vars.AUTOMATION_MIGRATE_ON_START || 'true' }}
      AUTOMATION_MAINTENANCE_ENABLED: ${{ vars.AUTOMATION_MAINTENANCE_ENABLED || 'true' }}
      AUTOMATION_MAINTENANCE_INTERVAL_SECONDS: ${{ vars.AUTOMATION_MAINTENANCE_INTERVAL_SECONDS || '30' }}
      AUTOMATION_MODEL_CATALOG_TTL_SECONDS: ${{ vars.AUTOMATION_MODEL_CATALOG_TTL_SECONDS || '300' }}
      AUTOMATION_MODEL_CATALOG_STALE_SECONDS: ${{ vars.AUTOMATION_MODEL_CATALOG_STALE_SECONDS || '86400' }}
      AUTOMATION_SCHEDULE_GRACE_SECONDS: ${{ vars.AUTOMATION_SCHEDULE_GRACE_SECONDS || '120' }}
      AUTOMATION_MANUAL_TRIGGER_LIMIT: ${{ vars.AUTOMATION_MANUAL_TRIGGER_LIMIT || '3' }}
      AUTOMATION_MANUAL_TRIGGER_WINDOW_SECONDS: ${{ vars.AUTOMATION_MANUAL_TRIGGER_WINDOW_SECONDS || '300' }}
      OA_PROJECT_SYNC_TOKEN: ${{ secrets.OA_PROJECT_SYNC_TOKEN }}
      OA_PROJECT_SYNC_TOKEN_HEADER: ${{ vars.OA_PROJECT_SYNC_TOKEN_HEADER || 'Authorization' }}
      OA_PROJECT_SYNC_TOKEN_PREFIX: ${{ vars.OA_PROJECT_SYNC_TOKEN_PREFIX || 'Bearer' }}
      PROJECT_PROGRESS_GITHUB_TOKEN: ${{ secrets.PROJECT_PROGRESS_GITHUB_TOKEN }}
      PROJECT_PROGRESS_WORKER_INSTANCE: ${{ vars.PROJECT_PROGRESS_WORKER_INSTANCE || 'oaagent-test-01' }}
      PROJECT_PROGRESS_LEASE_SECONDS: ${{ vars.PROJECT_PROGRESS_LEASE_SECONDS || '300' }}
      PROJECT_PROGRESS_HEARTBEAT_SECONDS: ${{ vars.PROJECT_PROGRESS_HEARTBEAT_SECONDS || '10' }}
      PROJECT_PROGRESS_GITHUB_CONCURRENCY: ${{ vars.PROJECT_PROGRESS_GITHUB_CONCURRENCY || '6' }}
      PROJECT_PROGRESS_GITHUB_MAX_BRANCHES: ${{ vars.PROJECT_PROGRESS_GITHUB_MAX_BRANCHES || '500' }}
      PROJECT_PROGRESS_GITHUB_MAX_COMMIT_PAGES_PER_BRANCH: ${{ vars.PROJECT_PROGRESS_GITHUB_MAX_COMMIT_PAGES_PER_BRANCH || '100' }}
      PROJECT_PROGRESS_GITHUB_MAX_REQUESTS_PER_REPOSITORY: ${{ vars.PROJECT_PROGRESS_GITHUB_MAX_REQUESTS_PER_REPOSITORY || '2000' }}
      PROJECT_PROGRESS_GITHUB_MAX_REQUESTS_PER_RUN: ${{ vars.PROJECT_PROGRESS_GITHUB_MAX_REQUESTS_PER_RUN || '20000' }}
      PROJECT_PROGRESS_AGENT_CONCURRENCY: ${{ vars.PROJECT_PROGRESS_AGENT_CONCURRENCY || '2' }}
      PROJECT_PROGRESS_OA_WRITE_CONCURRENCY: ${{ vars.PROJECT_PROGRESS_OA_WRITE_CONCURRENCY || '1' }}
      PROJECT_PROGRESS_AGENT_MAX_DETAIL_CALLS: ${{ vars.PROJECT_PROGRESS_AGENT_MAX_DETAIL_CALLS || '12' }}
      PROJECT_PROGRESS_AGENT_MAX_FILES_PER_COMMIT: ${{ vars.PROJECT_PROGRESS_AGENT_MAX_FILES_PER_COMMIT || '20' }}
      PROJECT_PROGRESS_AGENT_MAX_PATCH_CHARS_PER_FILE: ${{ vars.PROJECT_PROGRESS_AGENT_MAX_PATCH_CHARS_PER_FILE || '1200' }}
      PROJECT_PROGRESS_AGENT_MAX_TOTAL_PATCH_CHARS: ${{ vars.PROJECT_PROGRESS_AGENT_MAX_TOTAL_PATCH_CHARS || '12000' }}
      DEPLOY_PATH: /opt/rwkv/apps/oa-agent-test
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      COMPOSE_PROJECT_NAME: oa-agent-test
      AGENT_BIND_ADDRESS: ${{ vars.AGENT_BIND_ADDRESS || '127.0.0.1' }}
      AGENT_PORT: '3003'
      WEB_BIND_ADDRESS: 127.0.0.1
      WEB_PORT: '3001'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download deployment images
        uses: actions/download-artifact@v4
        with:
          pattern: deployment-image-*-${{ github.sha }}
          path: ${{ runner.temp }}/deployment-images
          merge-multiple: true

      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS NEXTTOKEN_API_KEY OPENROUTER_API_KEY OA_DOCKER_API_BASE_URL OA_KNOWLEDGE_BASE_API_KEY OA_AGENT_SSO_SHARED_SECRET OA_AGENT_SSO_TTL_SECONDS OA_AGENT_AUTOMATION_TOKEN DATABASE_URL OA_SESSION_SECRET OA_PROJECT_SYNC_TOKEN PROJECT_PROGRESS_GITHUB_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "Missing test deployment configuration: $name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Load deployment images on server
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          for service in agent web; do
            archive="$RUNNER_TEMP/deployment-images/${service}.tar.gz"
            if [[ ! -f "$archive" ]]; then
              echo "Missing deployment image archive: $archive" >&2
              exit 1
            fi
            gzip -dc "$archive" | ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$target" docker load
          done

      - name: Resolve release images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "AGENT_IMAGE=ghcr.io/${repository}-agent:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${repository}-web:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Upload runtime and Compose configuration
        shell: bash
        run: |
          runtime_env="$RUNNER_TEMP/${COMPOSE_PROJECT_NAME}.env"
          bash scripts/render-runtime-env.sh "$runtime_env"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_env="$DEPLOY_PATH/.env.next"
          remote_command="$(printf 'mkdir -p -- %q && umask 077 && cat > %q && chmod 600 %q' "$DEPLOY_PATH" "$remote_env" "$remote_env")"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$target" "$remote_command" < "$runtime_env"
          remote_command="$(printf 'cat > %q' "$DEPLOY_PATH/compose.yml")"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$target" "$remote_command" < compose.yml

      - name: Deploy and verify health
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_command="$(printf 'env SKIP_IMAGE_PULL=1 bash -s -- %q %q %q' "$DEPLOY_PATH" "$AGENT_IMAGE" "$WEB_IMAGE")"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$target" "$remote_command" < scripts/deploy-compose.sh

      - name: Record deployment summary
        run: |
          echo "### Test deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Agent: \`${AGENT_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: \`${WEB_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: oa-agent-shared-server-deploy
      cancel-in-progress: false
    environment:
      name: production
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      NEXTTOKEN_API_KEY: ${{ secrets.NEXTTOKEN_API_KEY }}
      NEXTTOKEN_API_BASE_URL: ${{ vars.NEXTTOKEN_API_BASE_URL || 'https://next-token.cc' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_BASE_URL: ${{ vars.OPENROUTER_API_BASE_URL || 'https://openrouter.ai/api/v1' }}
      OA_DOCKER_API_BASE_URL: ${{ vars.OA_DOCKER_API_BASE_URL }}
      OA_KNOWLEDGE_API_BASE_URL: ${{ vars.OA_KNOWLEDGE_API_BASE_URL || 'https://oa-kb.rwkvos.com/api/agent/v1' }}
      OA_KNOWLEDGE_BASE_API_KEY: ${{ secrets.OA_KNOWLEDGE_BASE_API_KEY }}
      AUTOMATION_API_BASE_URL: ${{ vars.AUTOMATION_API_BASE_URL }}
      PROJECT_SYNC_API_BASE_URL: ${{ vars.PROJECT_SYNC_API_BASE_URL }}
      OA_AUTH_ALIAS: ${{ vars.OA_AUTH_ALIAS || 'default' }}
      OA_AGENT_SSO_SHARED_SECRET: ${{ secrets.OA_AGENT_SSO_SHARED_SECRET }}
      OA_AGENT_SSO_TTL_SECONDS: ${{ vars.OA_AGENT_SSO_TTL_SECONDS }}
      OA_AGENT_AUTOMATION_TOKEN: ${{ secrets.OA_AGENT_AUTOMATION_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTOMATION_EXPECTED_DATABASE_NAME: oagent
      OA_SESSION_SECRET: ${{ secrets.OA_SESSION_SECRET }}
      OA_SESSION_VERIFY_MAX_AGE: ${{ vars.OA_SESSION_VERIFY_MAX_AGE || '0' }}
      AUTOMATION_MIGRATE_ON_START: ${{ vars.AUTOMATION_MIGRATE_ON_START || 'true' }}
      AUTOMATION_MAINTENANCE_ENABLED: ${{ vars.AUTOMATION_MAINTENANCE_ENABLED || 'true' }}
      AUTOMATION_MAINTENANCE_INTERVAL_SECONDS: ${{ vars.AUTOMATION_MAINTENANCE_INTERVAL_SECONDS || '30' }}
      AUTOMATION_MODEL_CATALOG_TTL_SECONDS: ${{ vars.AUTOMATION_MODEL_CATALOG_TTL_SECONDS || '300' }}
      AUTOMATION_MODEL_CATALOG_STALE_SECONDS: ${{ vars.AUTOMATION_MODEL_CATALOG_STALE_SECONDS || '86400' }}
      AUTOMATION_SCHEDULE_GRACE_SECONDS: ${{ vars.AUTOMATION_SCHEDULE_GRACE_SECONDS || '120' }}
      AUTOMATION_MANUAL_TRIGGER_LIMIT: ${{ vars.AUTOMATION_MANUAL_TRIGGER_LIMIT || '3' }}
      AUTOMATION_MANUAL_TRIGGER_WINDOW_SECONDS: ${{ vars.AUTOMATION_MANUAL_TRIGGER_WINDOW_SECONDS || '300' }}
      OA_PROJECT_SYNC_TOKEN: ${{ secrets.OA_PROJECT_SYNC_TOKEN }}
      OA_PROJECT_SYNC_TOKEN_HEADER: ${{ vars.OA_PROJECT_SYNC_TOKEN_HEADER || 'Authorization' }}
      OA_PROJECT_SYNC_TOKEN_PREFIX: ${{ vars.OA_PROJECT_SYNC_TOKEN_PREFIX || 'Bearer' }}
      PROJECT_PROGRESS_GITHUB_TOKEN: ${{ secrets.PROJECT_PROGRESS_GITHUB_TOKEN }}
      PROJECT_PROGRESS_WORKER_INSTANCE: ${{ vars.PROJECT_PROGRESS_WORKER_INSTANCE || 'oaagent-production-01' }}
      PROJECT_PROGRESS_LEASE_SECONDS: ${{ vars.PROJECT_PROGRESS_LEASE_SECONDS || '300' }}
      PROJECT_PROGRESS_HEARTBEAT_SECONDS: ${{ vars.PROJECT_PROGRESS_HEARTBEAT_SECONDS || '10' }}
      PROJECT_PROGRESS_GITHUB_CONCURRENCY: ${{ vars.PROJECT_PROGRESS_GITHUB_CONCURRENCY || '6' }}
      PROJECT_PROGRESS_GITHUB_MAX_BRANCHES: ${{ vars.PROJECT_PROGRESS_GITHUB_MAX_BRANCHES || '500' }}
      PROJECT_PROGRESS_GITHUB_MAX_COMMIT_PAGES_PER_BRANCH: ${{ vars.PROJECT_PROGRESS_GITHUB_MAX_COMMIT_PAGES_PER_BRANCH || '100' }}
      PROJECT_PROGRESS_GITHUB_MAX_REQUESTS_PER_REPOSITORY: ${{ vars.PROJECT_PROGRESS_GITHUB_MAX_REQUESTS_PER_REPOSITORY || '2000' }}
      PROJECT_PROGRESS_GITHUB_MAX_REQUESTS_PER_RUN: ${{ vars.PROJECT_PROGRESS_GITHUB_MAX_REQUESTS_PER_RUN || '20000' }}
      PROJECT_PROGRESS_AGENT_CONCURRENCY: ${{ vars.PROJECT_PROGRESS_AGENT_CONCURRENCY || '2' }}
      PROJECT_PROGRESS_OA_WRITE_CONCURRENCY: ${{ vars.PROJECT_PROGRESS_OA_WRITE_CONCURRENCY || '1' }}
      PROJECT_PROGRESS_AGENT_MAX_DETAIL_CALLS: ${{ vars.PROJECT_PROGRESS_AGENT_MAX_DETAIL_CALLS || '12' }}
      PROJECT_PROGRESS_AGENT_MAX_FILES_PER_COMMIT: ${{ vars.PROJECT_PROGRESS_AGENT_MAX_FILES_PER_COMMIT || '20' }}
      PROJECT_PROGRESS_AGENT_MAX_PATCH_CHARS_PER_FILE: ${{ vars.PROJECT_PROGRESS_AGENT_MAX_PATCH_CHARS_PER_FILE || '1200' }}
      PROJECT_PROGRESS_AGENT_MAX_TOTAL_PATCH_CHARS: ${{ vars.PROJECT_PROGRESS_AGENT_MAX_TOTAL_PATCH_CHARS || '12000' }}
      DEPLOY_PATH: /opt/rwkv/apps/oa-agent-prod
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      COMPOSE_PROJECT_NAME: oa-agent-prod
      AGENT_BIND_ADDRESS: ${{ vars.AGENT_BIND_ADDRESS || '127.0.0.1' }}
      AGENT_PORT: '3011'
      WEB_BIND_ADDRESS: 127.0.0.1
      WEB_PORT: '3010'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download deployment images
        uses: actions/download-artifact@v4
        with:
          pattern: deployment-image-*-${{ github.sha }}
          path: ${{ runner.temp }}/deployment-images
          merge-multiple: true

      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS NEXTTOKEN_API_KEY OPENROUTER_API_KEY OA_DOCKER_API_BASE_URL OA_KNOWLEDGE_BASE_API_KEY OA_AGENT_SSO_SHARED_SECRET OA_AGENT_SSO_TTL_SECONDS OA_AGENT_AUTOMATION_TOKEN DATABASE_URL OA_SESSION_SECRET OA_PROJECT_SYNC_TOKEN PROJECT_PROGRESS_GITHUB_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "Missing production deployment configuration: $name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Load deployment images on server
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          for service in agent web; do
            archive="$RUNNER_TEMP/deployment-images/${service}.tar.gz"
            if [[ ! -f "$archive" ]]; then
              echo "Missing deployment image archive: $archive" >&2
              exit 1
            fi
            gzip -dc "$archive" | ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$target" docker load
          done

      - name: Resolve release images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "AGENT_IMAGE=ghcr.io/${repository}-agent:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${repository}-web:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Upload runtime and Compose configuration
        shell: bash
        run: |
          runtime_env="$RUNNER_TEMP/${COMPOSE_PROJECT_NAME}.env"
          bash scripts/render-runtime-env.sh "$runtime_env"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_env="$DEPLOY_PATH/.env.next"
          remote_command="$(printf 'mkdir -p -- %q && umask 077 && cat > %q && chmod 600 %q' "$DEPLOY_PATH" "$remote_env" "$remote_env")"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$target" "$remote_command" < "$runtime_env"
          remote_command="$(printf 'cat > %q' "$DEPLOY_PATH/compose.yml")"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$target" "$remote_command" < compose.yml

      - name: Deploy and verify health
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_command="$(printf 'env SKIP_IMAGE_PULL=1 bash -s -- %q %q %q' "$DEPLOY_PATH" "$AGENT_IMAGE" "$WEB_IMAGE")"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_PORT" "$target" "$remote_command" < scripts/deploy-compose.sh

      - name: Record deployment summary
        run: |
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Agent: \`${AGENT_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: \`${WEB_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
